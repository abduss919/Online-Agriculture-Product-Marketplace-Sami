<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Agriculture Product Marketplace - Sami</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Online Agriculture Product Marketplace - Sami</h1>
        <p>Direct Farmer-to-Customer Marketplace</p>
    </header>

    <div class="container">
        <!-- Farmer Listing Form -->
        <div class="card">
            <h2>Farmer Panel: Add Agricultural Product</h2>
            <form id="productForm">
                <input type="number" id="farmerId" placeholder="Farmer ID (Enter 1)" required>
                <input type="text" id="productName" placeholder="Product Name (e.g. Sona Masoori Rice)" required>
                <input type="text" id="category" placeholder="Category (e.g. Grains, Vegetables)" required>
                <input type="number" step="0.01" id="price" placeholder="Price (in ₹)" required>
                <input type="number" id="quantity" placeholder="Quantity Available" required>
                <textarea id="description" placeholder="Description of the crop/product" rows="3"></textarea>
                <button type="submit">List Product for Sale</button>
            </form>
        </div>

        <!-- Marketplace Products View -->
        <div class="card">
            <h2>Marketplace Inventory</h2>
            <div id="productGrid" class="grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
